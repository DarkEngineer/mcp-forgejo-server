name: Build & Publish

# Tworzy pakiet przy każdym pushu do main.
# Dla tagów v* (np. v1.0.0) tworzy wydanie (Release) w Forgejo i dodaje plik tar.gz wraz z .sha256.

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"

# Nadanie uprawnień systemowemu tokenowi github.token do tworzenia wydań
permissions:
  contents: write

jobs:
  build-and-publish:
    name: Build & Publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve SDK
        id: sdk
        run: echo "version=$(grep -m1 TargetFramework src/ForgejoMcp/ForgejoMcp.csproj | sed -E 's/.*<TargetFramework>([^<]+)<.*/\1/' | sed -E 's/^net//')" >> "$GITHUB_OUTPUT"

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ steps.sdk.outputs.version }}

      - name: Build, test, package
        run: |
          set -uo pipefail
          bash scripts/package.sh
          echo "--- dist output ---"
          ls -la dist/
          echo "--- sha256 sidecar ---"
          cat dist/*.sha256

# Opcja A: Publikacja Release (Tarball + sidecar SHA256) za pomocą dedykowanej akcji
      - name: Publish Forgejo Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.sha256
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: List dist artifacts
        run: ls -la dist/